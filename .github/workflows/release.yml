name: Release

on:
  push:
    tags: ["v*"]
  # Lets you exercise packaging on all three platforms without cutting a tag.
  # The release job is skipped unless the run is for a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifacts: |
              release/*.exe
              release/*.blockmap
          - os: macos-latest
            script: dist:mac
            artifacts: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
          - os: ubuntu-latest
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.script }}
        env:
          # No signing certificates in CI. Without this electron-builder probes
          # the keychain and fails the macOS build instead of leaving it
          # unsigned. Remove it once CSC_LINK and CSC_KEY_PASSWORD are set.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
